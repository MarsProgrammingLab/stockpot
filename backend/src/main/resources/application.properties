spring.application.name=stockpot

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.datasource.url=jdbc:h2:mem:items
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=marsprogramminglab
spring.datasource.password=1111

# controls whether/how Hibernate manages the schema
# create-drop creates on startup, drops on shutdown
spring.jpa.hibernate.ddl-auto=create-drop

# Displays the SQL Hibernate generates in the console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true